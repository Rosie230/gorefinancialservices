<section class="px-6 py-16 md:px-12 md:py-24">
  <div class="mx-auto max-w-[1280px] rounded-[2.5rem] bg-white px-8 py-12 shadow-[0px_24px_48px_rgba(0,0,0,0.08)] md:px-12 md:py-14">
    <div class="max-w-[620px] space-y-4">
      <p class="flex items-center gap-2 text-eyebrow uppercase tracking-[0.2em] text-clay-brown">
        <span class="h-2 w-2 rounded-full bg-light-signal-orange"></span>
        How we work
      </p>
      <h2 class="text-h2-section text-ink-black">A process designed to reduce friction, not add to it.</h2>
    </div>
    <div class="mt-10 grid gap-6 md:grid-cols-3">
      {% for step in site.data.process_steps %}
        <article class="rounded-[2rem] bg-surface-container-low p-6">
          <p class="text-eyebrow uppercase tracking-[0.2em] text-clay-brown">Step {{ forloop.index }}</p>
          <h3 class="mt-3 text-h3-card text-ink-black">{{ step.title }}</h3>
          <p class="mt-4 text-body-standard text-slate-gray">{{ step.description }}</p>
        </article>
      {% endfor %}
    </div>
  </div>
</section>
